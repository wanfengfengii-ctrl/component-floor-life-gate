services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: .
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      VERIFY_BASE_URL: http://api:8000
    command: ["python", "-m", "pytest"]
